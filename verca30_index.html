<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>30 s Verčou</title>
<link rel="icon" href="assets/ikona-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/ikona-180.png">
<style>
/* ============================================================
   30 s Verčou — (c) 2026 KeCl v1.30
   ============================================================ */

/* === BAREVNÁ SCHÉMATA ==================================== */
:root {
  --bg: #fff5fa;
  --bg2: #f3f0ff;
  --surface: #ffffff;
  --surface2: #fdf4ff;
  --text: #241a2e;
  --text-muted: #6b5f77;
  --border: #ecd9f2;
  --accent: #d6336c;
  --accent2: #7048e8;
  --accent-text: #ffffff;
  /* O kolik se v kvízové kartě zvětší písmo (mobil má vlastní hodnotu níž) */
  --kviz-plus: 1px;
  --ok: #2b8a3e;
  --ok-bg: #d3f9d8;
  --bad: #c92a2a;
  --bad-bg: #ffe3e3;
  --shadow: 0 2px 10px rgba(90,40,110,.10);
  --shadow-lg: 0 14px 40px rgba(90,40,110,.22);
}
html[data-theme="dark"] {
  --bg: #17122a;
  --bg2: #1f1838;
  --surface: #241c3f;
  --surface2: #2d2350;
  --text: #f4eeff;
  --text-muted: #b4a6d0;
  --border: #3a2f5e;
  --accent: #ff6b9d;
  --accent2: #b197fc;
  --accent-text: #1a1330;
  --ok: #8ce99a;
  --ok-bg: #1f4d2b;
  --bad: #ffa8a8;
  --bad-bg: #5b1f1f;
  --shadow: 0 2px 10px rgba(0,0,0,.4);
  --shadow-lg: 0 14px 40px rgba(0,0,0,.55);
}

/* === ZÁKLAD ============================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: clamp(16px, 1.05vw, 19px);
  background:
    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 12%, transparent) 0 22%, transparent 45%),
    radial-gradient(circle at 88% 14%, color-mix(in srgb, var(--accent2) 14%, transparent) 0 20%, transparent 42%),
    radial-gradient(circle at 70% 92%, color-mix(in srgb, var(--accent) 10%, transparent) 0 18%, transparent 40%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  transition: background .25s ease, color .25s ease;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.15; }

/* === HLAVIČKA ============================================ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px clamp(12px, 2.5vw, 26px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 40;
}
.app-header h1 {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: .4em;
  font-size: clamp(1.6rem, 4.4vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -.01em;
  background: linear-gradient(95deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap;
}
.h1-dort { width: 1.05em; height: 1.05em; flex: none; }
.app-header h1 { margin-right: auto; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; order: 2; }
.header-ikony { display: flex; align-items: center; gap: 8px; order: 3; }

/* Mobil: první řádek nadpis + ikony, druhý řádek ovládání a skóre */
@media (max-width: 760px) {
  /* v1.30: na mobilu je všechno písmo o ~16 % větší. Skoro celá appka počítá
     velikosti v rem, takže stačí zvednout kořenovou velikost — poměry zůstanou. */
  html { font-size: 18.5px; }
  body { font-size: 1rem; }
  :root { --kviz-plus: 3px; }
  .app-header h1 { font-size: clamp(1.9rem, 7.4vw, 2.4rem); }
  .header-ikony { order: 2; }
  .header-actions { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .theme-toggle-label { display: none; }
  .theme-toggle { padding: 7px 11px; }
}
.skore-box {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  font-size: .95rem; font-weight: 400;
}
.skore-box b { font-weight: 400; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 13px;
  white-space: nowrap;
}
.chip b { color: var(--accent); }

/* === TLAČÍTKA ============================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 18px;
  font-size: .95rem; font-weight: 600;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.btn-hlavni {
  background: linear-gradient(95deg, var(--accent), var(--accent2));
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent);
  font-size: clamp(1rem, 2vw, 1.15rem);
  padding: 13px 30px;
}
/* Druhé tlačítko na závěrečné stránce — stejně velké jako hlavní, jen bez výplně */
.btn-vedlejsi {
  font-size: clamp(1rem, 2vw, 1.15rem);
  padding: 13px 30px;
  border-width: 2px;
  border-color: var(--accent2);
  color: var(--accent2);
}
.btn-vedlejsi:hover { background: color-mix(in srgb, var(--accent2) 10%, var(--surface)); }
.btn-ikona { padding: 7px 11px; display: flex; align-items: center; }
.btn-ikona svg { width: 25px; height: 25px; display: block; }
/* Tlačítko „Vzdávám to" — ukončí rozehranou hru a skočí na žebříček */
.btn-vzdat {
  border-color: var(--border);
  color: var(--text);
  font-size: .95rem;
  font-weight: 800;
  padding: 6px 15px;
  gap: 7px;
}
.btn-vzdat:hover { color: var(--accent2); border-color: var(--accent2); }
.btn-vzdat svg { width: 1.05em; height: 1.05em; flex: none; }

/* === THEME TOGGLE ======================================== */
.theme-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: .85rem; line-height: 1;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
  user-select: none;
}
.theme-toggle:hover { border-color: var(--accent); }
.theme-toggle:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.theme-toggle-icon { font-size: 1rem; line-height: 1; }
.theme-toggle-hint { color: var(--text-muted); font-size: .8rem; }
.theme-toggle[data-mode="day"]   { background: #fff7d6; color: #5a4400; border-color: #e8d27a; }
.theme-toggle[data-mode="night"] { background: #1d2128; color: #e8eaed; border-color: #3a4150; }

/* === HLAVNÍ OBSAH ======================================== */
main { flex: 1; width: 100%; padding: clamp(14px, 2.4vw, 28px); }
.scene { display: none; }
.scene.aktivni { display: block; animation: vstup .45s ease both; }
@keyframes vstup { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none; } }

/* === ÚVOD (zadání jména) ================================= */
.uvod-wrap {
  max-width: 680px; margin: clamp(10px, 5vh, 60px) auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: clamp(22px, 4vw, 48px);
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.uvod-emoji { font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1; margin-bottom: 8px; }
.uvod-wrap h2 { margin: 0 0 6px; font-size: clamp(1.5rem, 4.4vw, 2.3rem); }
.uvod-wrap p { color: var(--text-muted); margin: 0 0 22px; font-size: clamp(1rem, 2.2vw, 1.15rem); }
.pole {
  width: 100%;
  font: inherit; font-size: clamp(1.05rem, 2.6vw, 1.3rem);
  text-align: center;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 16px;
  background: var(--surface2);
  color: var(--text);
  margin-bottom: 16px;
}
.pole:focus { outline: none; border-color: var(--accent); }
.chyba { color: var(--bad); font-weight: 600; min-height: 1.3em; margin: 0 0 10px; }

/* === MŘÍŽKA OKÉNEK ======================================= */
.hra-hlavicka { text-align: center; margin-bottom: clamp(12px, 2.5vw, 22px); }
.hra-hlavicka h2 { margin: 0 0 4px; font-size: clamp(1.15rem, 3vw, 1.7rem); }
.hra-hlavicka p { margin: 0; color: var(--text-muted); font-size: clamp(.92rem, 2vw, 1.05rem); }
.mrizka {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(7px, 1.1vw, 15px);
  max-width: 1500px;
  margin: 0 auto;
}
/* Na širokých displejích se celá deska vejde na jednu obrazovku bez rolování:
   šířka mřížky je odvozená od dostupné výšky (okénka jsou na šířku 4:3 jako fotky). */
@media (min-width: 1151px) {
  /* v1.21: 6 sloupců × 5 řádků, mřížka téměř přes celou šířku okna.
     Ladicí šrouby:
       – počet sloupců: repeat(6, 1fr)  (5 sloupců = 5×6 místo 6×5)
       – šířka: 94vw = „skoro celá obrazovka"; strop 2000px kvůli ultrawide
     Kdyby bylo potřeba zase odvozovat od výšky okna (fit na N řad), vrať
     max-width: calc((100svh - 240px) * K), K = 2,16 (3 řady) / 1,62 (4) / 1,30 (5). */
  .mrizka { --pomer: 4 / 3; grid-template-columns: repeat(6, 1fr); max-width: min(2000px, 94vw); }
}
@media (min-width: 761px) and (max-width: 1150px) {
  .mrizka { --pomer: 4 / 3; grid-template-columns: repeat(5, 1fr); max-width: max(560px, calc((100svh - 240px) * 1.11)); }
}
@media (max-width: 760px)  { .mrizka { grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 14px); } }

.okenko {
  all: unset;
  display: block;
  aspect-ratio: var(--pomer, 1 / 1);
  cursor: pointer;
  perspective: 900px;
  border-radius: 18px;
}
.okenko:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }
.okenko-inner {
  display: block;
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.2,.8,.3,1);
  border-radius: 18px;
}
.okenko.otoceno .okenko-inner { transform: rotateY(180deg); }
.okenko:hover .okenko-inner { transform: scale(1.04); }
.okenko.otoceno:hover .okenko-inner { transform: rotateY(180deg) scale(1.04); }
.face {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.face-front { color: #fff; }
.face-front .emo {
  font-size: clamp(1.7rem, 4.6vw, 3rem);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
  transition: transform .2s ease;
}
.okenko:hover .face-front .emo { transform: scale(1.12) rotate(-6deg); }
/* Víčka = samolepky Verči na lícové straně okének */
.face-front .vicko {
  width: 84%; height: 84%;
  object-fit: contain;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 3px 7px rgba(0,0,0,.38));
  transition: transform .2s ease;
}
.face-front .vicko-placeholder svg { width: 64%; height: 64%; }
.okenko:hover .face-front .vicko { transform: scale(1.09) rotate(-3deg); }
.face-back {
  transform: rotateY(180deg);
  background: var(--surface2);
  border: 2px solid var(--border);
}
.face-back img { width: 100%; height: 100%; object-fit: cover; display: block; }
.znacka {
  position: absolute; top: 5px; right: 5px;
  width: clamp(20px, 3.4vw, 28px); height: clamp(20px, 3.4vw, 28px);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(.7rem, 1.8vw, .95rem); font-weight: 800;
  color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.znacka.ok  { background: #2f9e44; }
.znacka.bad { background: #e03131; }

/* === PŘEKRYVNÁ OKNA (karta, lightbox) ==================== */
.overlay {
  position: fixed; inset: 0;
  background: rgba(20, 10, 30, .82);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center; justify-content: center;
  padding: clamp(10px, 2vw, 26px);
}
.overlay.aktivni { display: flex; animation: fadein .25s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.karta-box {
  background: var(--surface);
  border-radius: 24px;
  width: min(1320px, 100%);
  max-height: 94svh;
  overflow: auto;
  box-shadow: var(--shadow-lg);
  position: relative;
  animation: vyskoc .3s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes vyskoc { from { opacity: 0; transform: scale(.92) translateY(18px); } to { opacity: 1; transform: none; } }
.karta-mrizka { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
@media (max-width: 900px) { .karta-mrizka { grid-template-columns: 1fr; } }

.karta-foto {
  background: linear-gradient(150deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  padding: 14px;
  border-radius: 24px 0 0 24px;
  min-height: 200px;
}
@media (max-width: 900px) { .karta-foto { border-radius: 24px 24px 0 0; padding: 10px; } }
.karta-foto img {
  max-width: 100%;
  max-height: min(62svh, 560px);
  border-radius: 14px;
  cursor: zoom-in;
  display: block;
  box-shadow: 0 8px 26px rgba(0,0,0,.3);
}
@media (max-width: 900px) {
  .karta-foto img { max-height: 30svh; }
  .karta-foto { padding: 8px; min-height: 0; }
  .karta-kviz { padding: 16px 16px 20px; }
  .karta-otazka { margin-bottom: 14px; }
  .odpovedi { gap: 8px; }
  .odpoved { padding: 11px 13px; }
  .odpoved .pismeno { width: 30px; height: 30px; }
}

.karta-kviz { padding: clamp(18px, 2.6vw, 34px); display: flex; flex-direction: column; justify-content: center; }
/* Rodinná otázka — výrazný tag vlevo nad otázkou a vysvětlivka pod odpověďmi */
.rodinna-odznak {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0 0 22px; padding: 6px 14px; border-radius: 999px;
  font-size: calc(clamp(.8rem, 1.25vw, .92rem) + var(--kviz-plus));
  font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4); color: #7a2d3f;
  box-shadow: 0 3px 10px rgba(0,0,0,.14);
}
.rodinna-pozn { margin: 10px 0 0; font-size: calc(clamp(.9rem, 1.4vw, 1rem) + var(--kviz-plus)); line-height: 1.4; font-style: italic; color: var(--text-muted); }
.karta-otazka { margin: 0 0 20px; font-size: calc(clamp(1.15rem, 2.3vw, 1.7rem) + var(--kviz-plus)); line-height: 1.3; }
.odpovedi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 1100px) { .odpovedi { grid-template-columns: 1fr; } }
.odpoved {
  text-align: left;
  color: var(--text);
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  font-size: calc(clamp(1rem, 1.9vw, 1.15rem) + var(--kviz-plus));
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  transition: transform .12s ease, border-color .15s ease, background .15s ease;
}
.odpoved:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.odpoved:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.odpoved:disabled { cursor: default; }
.odpoved .pismeno {
  flex: 0 0 auto;
  width: calc(34px + var(--kviz-plus)); height: calc(34px + var(--kviz-plus)); border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
}
.odpoved.spravne { background: var(--ok-bg); border-color: var(--ok); color: var(--text); }
.odpoved.spravne .pismeno { background: var(--ok); color: #fff; }
.odpoved.spatne { background: var(--bad-bg); border-color: var(--bad); color: var(--text); }
.odpoved.spatne .pismeno { background: var(--bad); color: #fff; }
.odpoved.tlumene { opacity: .5; }

.vysledek-radek {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: calc(clamp(1rem, 2vw, 1.15rem) + var(--kviz-plus));
  display: none;
}
.vysledek-radek.aktivni { display: block; animation: vstup .3s ease both; }
.vysledek-radek .hlavni { font-weight: 700; font-size: .92em; line-height: 1.25; display: block; margin-bottom: 10px; }
.vysledek-radek.ok .hlavni  { color: var(--ok); }
.vysledek-radek.bad .hlavni { color: var(--bad); }
.karta-paticka { margin-top: 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.zavrit {
  position: absolute; top: 10px; right: 12px;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,.45);
  color: #fff;
  font-size: 1.4rem; line-height: 1;
  cursor: pointer;
  z-index: 5;
  display: flex; align-items: center; justify-content: center;
}
.zavrit:hover { background: rgba(0,0,0,.7); }
.zavrit:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

#lightbox img {
  max-width: 96vw; max-height: 90svh;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  cursor: zoom-out;
}

/* === ZÁVĚREČNÁ OBRAZOVKA ================================= */
.konec-wrap { max-width: 900px; margin: 0 auto; }
.konec-karta {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: clamp(20px, 3.5vw, 44px);
  box-shadow: var(--shadow-lg);
  text-align: center;
  margin-bottom: 22px;
}
.konec-karta h2 { margin: 0 0 10px; font-size: clamp(1.6rem, 5vw, 2.6rem); }
.velke-skore {
  font-size: clamp(2.2rem, 7vw, 3.4rem);
  font-weight: 900; line-height: 1;
  background: linear-gradient(95deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin: 8px 0 0;
}
.konec-karta .hodnoceni { font-size: clamp(1.05rem, 2.4vw, 1.3rem); color: var(--text-muted); margin: 26px 0 28px; }
.konec-akce { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.tabulka-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: clamp(16px, 3vw, 32px);
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.tabulka-box h3 { margin: 0 0 14px; font-size: clamp(1.2rem, 3vw, 1.6rem); text-align: center; }
.zebricek { width: 100%; border-collapse: collapse; font-size: clamp(.95rem, 2vw, 1.1rem); }
.zebricek th, .zebricek td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--border); }
.zebricek th { color: var(--text-muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
.zebricek td.poradi { width: 56px; font-weight: 800; color: var(--text-muted); }
.zebricek td.body { text-align: right; font-weight: 800; color: var(--accent); white-space: nowrap; }
.zebricek td.kdy { text-align: right; color: var(--text-muted); font-size: .85em; white-space: nowrap; }
@media (max-width: 560px) { .zebricek td.kdy, .zebricek th.kdy { display: none; } }

/* ============================================================
   POMOCNÉ FUNKCE
   ============================================================ */
const $ = (id) => document.getElementById(id);

function hashText(s) {
  let h = 5381;
  for (const c of String(s)) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0;
  return h;
}

/* Index správné možnosti. `spravne` smí být číslo (0–3) NEBO přímo text
   správné odpovědi; text se dohledá v poli `moznosti` (bez ohledu na velikost
   písmen a mezery na krajích). Když se text nenajde, bere se první možnost
   a do konzole jde varování. */
function spravnyIndex(q) {
  if (typeof q.spravne === 'number') return q.spravne;
  const hledane = String(q.spravne == null ? '' : q.spravne).trim().toLowerCase();
  const i = q.moznosti.findIndex(m => String(m).trim().toLowerCase() === hledane);
  if (i < 0) {
    console.warn('Otázka „' + q.otazka + '“: správná odpověď „' + q.spravne + '“ není mezi možnostmi.');
    return 0;
  }
  return i;
}

/* Náhodné pořadí možností A–D pro každou otázku (pro jednu hru/hráče) */
function zamichejMoznosti() {
  return OTAZKY.map(q => zamichej(q.moznosti.map((_, i) => i)));
}

function zamichej(pole) {
  const a = pole.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* Náhodné rozmístění víček po mřížce; kde víčko není, je null */
function rozmistiVicka() {
  const pole = VICKA.slice(0, OTAZKY.length);
  while (pole.length < OTAZKY.length) pole.push(null);
  return zamichej(pole);
}

/* Neutrální placeholder pro okénka, ke kterým zatím víčko není */
function placeholderVicko() {
  const s = document.createElement('span');
  s.className = 'vicko vicko-placeholder';
  s.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">'
    + '<circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-dasharray="7 6"/>'
    + '<circle cx="50" cy="40" r="14" fill="rgba(255,255,255,.72)"/>'
    + '<path d="M23 77c0-14.5 12-23 27-23s27 8.5 27 23z" fill="rgba(255,255,255,.72)"/>'
    + '</svg>';
  return s;
}

/* Náhradní obrázek, dokud nejsou nahrané skutečné fotky */
function nahradniFoto(poradi, emoji) {
  const g = ['#ff6b9d','#f8b500','#4facfe','#43e97b','#a55eea','#30cfd0'][poradi % 6];
  const q = OTAZKY[poradi];
  const cesta = q ? CONFIG.fotoSlozka + q.foto : '?';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
    <rect width="800" height="600" fill="${g}"/>
    <text x="400" y="250" font-size="140" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
    <text x="400" y="380" font-size="38" fill="#ffffff" font-family="sans-serif" text-anchor="middle">chybí soubor</text>
    <text x="400" y="440" font-size="34" fill="#ffffff" font-family="monospace" text-anchor="middle">${cesta}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   STAV HRY  (drží se v sessionStorage — přežije refresh v témže okně)
   ============================================================ */
const KLIC_STAV = 'verca30-stav';
const KLIC_ZEBRICEK = 'verca30-zebricek';

let stav = null;

function novyStav(jmeno) {
  return {
    jmeno: jmeno,
    poradi: zamichej(OTAZKY.map((_, i) => i)),
    emoji: zamichej(EMOJI),
    vicka: rozmistiVicka(),
    poradiMoznosti: zamichejMoznosti(),   // index otázky -> pořadí možností pro tuto hru
    odpovedi: {},          // index otázky -> zvolená možnost (index do OTAZKY[i].moznosti)
    body: 0,
    hotovo: false,
    zapsano: false,
    zacatek: Date.now()
  };
}

function ulozStav() {
  try { sessionStorage.setItem(KLIC_STAV, JSON.stringify(stav)); } catch (e) {}
}

function nactiStav() {
  try {
    const raw = sessionStorage.getItem(KLIC_STAV);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.jmeno || !Array.isArray(s.poradi) || s.poradi.length !== OTAZKY.length) return null;
    if (!Array.isArray(s.vicka) || s.vicka.length !== OTAZKY.length) s.vicka = rozmistiVicka();
    if (!Array.isArray(s.poradiMoznosti) || s.poradiMoznosti.length !== OTAZKY.length) s.poradiMoznosti = zamichejMoznosti();
    return s;
  } catch (e) { return null; }
}

function pocetZodpovezenych() { return Object.keys(stav.odpovedi).length; }

/* ============================================================
   OBRAZOVKY
   ============================================================ */
function scena(jmeno) {
  ['sceneUvod', 'sceneHra', 'sceneKonec'].forEach(id => {
    $(id).classList.toggle('aktivni', id === jmeno);
  });
  // Po dohrané hře se dá z prohlížení fotek vrátit na žebříček
  $('zebricekBtn').style.display = (jmeno === 'sceneHra' && stav && stav.hotovo) ? '' : 'none';
  requestAnimationFrame(srovnejHlavicku);
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ============================================================
   MŘÍŽKA
   ============================================================ */
function vykresliMrizku() {
  const mrizka = $('mrizka');
  mrizka.innerHTML = '';

  stav.poradi.forEach((idx, pozice) => {
    const q = OTAZKY[idx];
    const emoji = stav.emoji[pozice % stav.emoji.length];
    const zodpovezeno = Object.prototype.hasOwnProperty.call(stav.odpovedi, idx);
    const spravne = zodpovezeno && stav.odpovedi[idx] === spravnyIndex(q);

    const btn = document.createElement('button');
    btn.className = 'okenko' + (zodpovezeno ? ' otoceno' : '');
    btn.type = 'button';
    btn.dataset.idx = idx;
    btn.dataset.pozice = pozice;
    btn.setAttribute('aria-label', zodpovezeno ? 'Zodpovězené okénko – zobrazit fotku' : 'Neotevřené okénko');

    const inner = document.createElement('span');
    inner.className = 'okenko-inner';

    const front = document.createElement('span');
    front.className = 'face face-front';
    front.style.background = GRADIENTY[pozice % GRADIENTY.length];
    const vicko = (stav.vicka && stav.vicka[pozice]) || null;
    if (vicko) {
      const v = document.createElement('img');
      v.className = 'vicko';
      v.loading = 'lazy';
      v.alt = '';
      v.src = CONFIG.vickaSlozka + vicko;
      v.addEventListener('error', () => { v.replaceWith(placeholderVicko()); }, { once: true });
      front.appendChild(v);
    } else {
      front.appendChild(placeholderVicko());
    }

    const back = document.createElement('span');
    back.className = 'face face-back';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    img.src = CONFIG.fotoSlozka + q.foto;
    img.addEventListener('error', () => { img.src = nahradniFoto(idx, emoji); }, { once: true });
    back.appendChild(img);
    if (zodpovezeno) {
      const zn = document.createElement('span');
      zn.className = 'znacka ' + (spravne ? 'ok' : 'bad');
      zn.textContent = spravne ? '✓' : '✕';
      back.appendChild(zn);
    }

    inner.appendChild(front);
    inner.appendChild(back);
    btn.appendChild(inner);
    btn.addEventListener('click', () => klikNaOkenko(idx, pozice));
    mrizka.appendChild(btn);
  });

  aktualizujSkore();
  requestAnimationFrame(srovnejHlavicku);
}

/* Nadpis v záhlaví zarovnáme s levým krajem mřížky (a akce s pravým). */
function srovnejHlavicku() {
  const hd = document.querySelector('.app-header');
  const sc = document.querySelector('.scene.aktivni');
  if (!hd || !sc) return;
  const el = sc.querySelector('.mrizka, .konec-wrap, .uvod-wrap') || sc;
  const r = el.getBoundingClientRect();
  if (r.width < 10) return;               // scéna zrovna není vidět
  const pad = Math.max(12, Math.round(r.left));
  hd.style.paddingLeft = pad + 'px';
  hd.style.paddingRight = pad + 'px';
}
window.addEventListener('resize', srovnejHlavicku);

let vzdatKlik = 0;

function aktualizujSkore() {
  $('pocetOtevrenych').textContent = pocetZodpovezenych();
  $('pocetBodu').textContent = stav.body;
  $('skoreBox').style.display = '';
  $('vzdatBtn').style.display = stav.hotovo ? 'none' : '';
  $('zebricekBtn').style.display = stav.hotovo ? '' : 'none';
}

function klikNaOkenko(idx, pozice) {
  const zodpovezeno = Object.prototype.hasOwnProperty.call(stav.odpovedi, idx);
  const emoji = stav.emoji[pozice % stav.emoji.length];
  if (zodpovezeno) {
    otevriLightbox(CONFIG.fotoSlozka + OTAZKY[idx].foto, idx, emoji);
  } else {
    otevriKartu(idx, pozice);
  }
}

/* ============================================================
   KARTA S OTÁZKOU
   ============================================================ */
let aktualniIdx = null;

function otevriKartu(idx, pozice) {
  aktualniIdx = idx;
  const q = OTAZKY[idx];
  const emoji = stav.emoji[pozice % stav.emoji.length];

  const foto = $('kartaFoto');
  foto.src = CONFIG.fotoSlozka + q.foto;
  foto.onerror = () => { foto.onerror = null; foto.src = nahradniFoto(idx, emoji); };
  foto.onclick = () => otevriLightbox(foto.src, idx, emoji);

  $('kartaOtazka').textContent = q.otazka;
  $('kartaRodinna').style.display = q.rodinna ? '' : 'none';
  $('kartaRodinnaPozn').style.display = q.rodinna ? '' : 'none';

  const box = $('kartaOdpovedi');
  box.innerHTML = '';
  const pismena = ['A', 'B', 'C', 'D'];
  // Pořadí možností je pro každou hru jiné — pod písmenem A tedy pokaždé sedí
  // něco jiného. `orig` je původní index v q.moznosti, s ním se pracuje dál.
  const poradi = (stav.poradiMoznosti && stav.poradiMoznosti[idx]) || q.moznosti.map((_, i) => i);
  poradi.forEach((orig, i) => {
    const b = document.createElement('button');
    b.className = 'odpoved';
    b.type = 'button';
    b.dataset.orig = orig;
    b.innerHTML = '<span class="pismeno">' + pismena[i] + '</span><span>' + escapeHtml(q.moznosti[orig]) + '</span>';
    b.addEventListener('click', () => odpovez(idx, orig));
    box.appendChild(b);
  });

  const vys = $('kartaVysledek');
  vys.className = 'vysledek-radek';
  vys.innerHTML = '';
  $('kartaPokracovat').style.display = 'none';
  $('kartaZavrit').style.display = '';

  $('karta').classList.add('aktivni');
  document.body.style.overflow = 'hidden';
}

function zavriKartu() {
  $('karta').classList.remove('aktivni');
  document.body.style.overflow = '';
  aktualniIdx = null;
}

function odpovez(idx, volba) {
  if (Object.prototype.hasOwnProperty.call(stav.odpovedi, idx)) return;
  const q = OTAZKY[idx];
  const spravne = volba === spravnyIndex(q);

  stav.odpovedi[idx] = volba;
  if (spravne) stav.body++;
  ulozStav();

  // Označí se pouze zvolená možnost — správná odpověď se neprozrazuje,
  // aby mělo smysl hrát znovu a zlepšovat si skóre.
  const tlacitka = $('kartaOdpovedi').querySelectorAll('.odpoved');
  tlacitka.forEach((b) => {
    b.disabled = true;
    if (Number(b.dataset.orig) === volba) b.classList.add(spravne ? 'spravne' : 'spatne');
    else b.classList.add('tlumene');
  });

  const vys = $('kartaVysledek');
  vys.className = 'vysledek-radek aktivni ' + (spravne ? 'ok' : 'bad');
  const hlavicka = spravne ? '✅ Správně! +1 bod' : '❌ Tentokrát ne…';
  // Komentář se ukazuje jen po správné odpovědi.
  vys.innerHTML = '<span class="hlavni">' + hlavicka + '</span>' +
                  (spravne && q.komentar ? escapeHtml(q.komentar) : '');

  $('kartaPokracovat').style.display = '';
  $('kartaPokracovat').focus();
  try { vys.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}

  // otočit okénko v mřížce
  const btn = $('mrizka').querySelector('.okenko[data-idx="' + idx + '"]');
  if (btn) {
    btn.classList.add('otoceno');
    btn.setAttribute('aria-label', 'Zodpovězené okénko – zobrazit fotku');
    const back = btn.querySelector('.face-back');
    if (back && !back.querySelector('.znacka')) {
      const zn = document.createElement('span');
      zn.className = 'znacka ' + (spravne ? 'ok' : 'bad');
      zn.textContent = spravne ? '✓' : '✕';
      back.appendChild(zn);
    }
  }
  aktualizujSkore();
}

function pokracovat() {
  zavriKartu();
  if (pocetZodpovezenych() >= OTAZKY.length) {
    dokoncit();
  }
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function otevriLightbox(src, idx, emoji) {
  const img = $('lightboxFoto');
  img.onerror = () => { img.onerror = null; img.src = nahradniFoto(idx || 0, emoji || '🎂'); };
  img.src = src;
  $('lightbox').classList.add('aktivni');
  document.body.style.overflow = 'hidden';
}

function zavriLightbox() {
  $('lightbox').classList.remove('aktivni');
  if (!$('karta').classList.contains('aktivni')) document.body.style.overflow = '';
}

/* ============================================================
   ZÁVĚR + ŽEBŘÍČEK
   ============================================================ */
/* Hlášky pro 11. místo a dál — vybírá se náhodně. Klidně si je přepiš. */
const HLASKY_DALE = [
  '🫧 Body nejsou všechno — hlavní je, že jsi tu dnes s ' + CONFIG.oslavenkyneSKym + '.',
  '📚 Tohle chce ještě jeden společný večer, příště to bude lepší.',
  '🧠 Paměť je zrádná věc. Srdce ale ví svoje.',
  '🐢 Pomalu, ale jistě. Do desítky se příště doplazíš.',
  '🎯 Uhodnout ' + CONFIG.oslavenkyneKoho + ' není jen tak — klobouk dolů za pokus!',
  '🍰 Za účast dort, za vědomosti až příště.',
  '🙃 Žebříček je jen číslo. Dárek snad zaboduje víc.',
  '🔍 Detektivem roku to nebude, ale zábava to byla.',
  '🎲 Kdyby se body dávaly za nadšení, bereš zlato.',
  '🌱 Každý mistr začínal takhle. Za rok pozor!',
  '🎈 ' + CONFIG.oslavenkyne + ' tě má ráda i s tímhle skóre.',
  '⏳ Třicet let se prostě nenastuduje za pět minut.'
];

function hlaskaPodlePoradi(poradi, body, celkem) {
  let t;
  if (poradi === 1)      t = '🥇 VÍTĚZSTVÍ! Nikdo zatím nezná ' + CONFIG.oslavenkyneKoho + ' líp než ty. Smekáme!';
  else if (poradi === 2) t = '🥈 Stříbro! O fous za vítězem a vysoko nad všemi ostatními.';
  else if (poradi === 3) t = '🥉 Bronz! Bedna je bedna — gratulujeme!';
  else if (poradi <= 5)  t = '🏅 ' + poradi + '. místo — bedna utekla jen o kousek. Skvělý výsledek!';
  else if (poradi <= 10) t = '💪 ' + poradi + '. místo, tedy krásná top desítka. Pěkná práce!';
  else if (poradi > 10)  t = HLASKY_DALE[Math.floor(Math.random() * HLASKY_DALE.length)];
  else                   t = '🎉 Hotovo! Výsledek je zapsaný v žebříčku.';
  if (body === celkem) t += ' A k tomu plný počet bodů!';
  return t;
}

async function dokoncit(vzdal) {
  // vzdal = hráč skončil předčasně tlačítkem „Vzdávám to" — hra se uzavře
  // a výsledek jde do žebříčku stejně, ale bez konfet (není co slavit).
  stav.hotovo = true;
  ulozStav();
  $('vzdatBtn').style.display = 'none';

  // Do žebříčku se počítají jen hry se všemi zodpovězenými otázkami.
  const kompletni = pocetZodpovezenych() === OTAZKY.length;

  $('konecIkona').textContent = vzdal ? '🏳️' : '🏆';
  $('konecJmeno').textContent = stav.jmeno + (vzdal ? ', tak zase někdy příště!' : ', máš hotovo!');
  $('konecBody').textContent = stav.body;
  // Po vzdání body neukazujeme — do žebříčku se stejně nepočítají.
  $('konecSkore').style.display = vzdal ? 'none' : '';
  // U nedokončené hry rovnou vysvětlíme, proč nejde do žebříčku.
  $('konecHodnoceni').textContent = kompletni ? '' : '🏳️ Nedokončený kvíz se do žebříčku nezapisuje.';

  scena('sceneKonec');
  if (!vzdal) konfety(7000);

  let mujZaznam = null;
  if (kompletni && !stav.zapsano) {
    stav.zapsano = true;
    ulozStav();
    mujZaznam = {
      id: 'z' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      jmeno: stav.jmeno,
      body: stav.body,
      celkem: OTAZKY.length,
      kdy: new Date().toISOString()
    };
    await zapisVysledek(mujZaznam);
  }
  const poradi = await vykresliZebricek(mujZaznam);
  if (kompletni) {
    $('konecHodnoceni').textContent = hlaskaPodlePoradi(poradi, stav.body, OTAZKY.length);
    if (poradi === 1 && !vzdal) konfety(12000);
  }
}

function lokalniZebricek() {
  try {
    const raw = localStorage.getItem(KLIC_ZEBRICEK);
    const d = raw ? JSON.parse(raw) : [];
    return Array.isArray(d) ? d : [];
  } catch (e) { return []; }
}

function ulozLokalne(pole) {
  try { localStorage.setItem(KLIC_ZEBRICEK, JSON.stringify(pole)); } catch (e) {}
}

async function vzdalenyZebricek() {
  if (!CONFIG.zebricekURL) return null;
  try {
    const r = await fetch(CONFIG.zebricekURL, { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    if (d === null || d === undefined) return [];          // prázdná databáze
    if (Array.isArray(d)) return d.filter(Boolean);
    if (Array.isArray(d.zaznamy)) return d.zaznamy;
    return Object.values(d).filter(z => z && z.jmeno != null);  // objekt klíč→záznam
  } catch (e) { return null; }
}

async function zapisVzdalene(zaznam) {
  if (!CONFIG.zebricekURL) return false;
  try {
    const r = await fetch(CONFIG.zebricekURL, {
      method: 'POST',                       // přidá záznam pod vlastní klíč
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(zaznam)
    });
    return r.ok;
  } catch (e) { return false; }
}

async function smazVzdalene() {
  if (!CONFIG.zebricekURL) return false;
  try {
    const r = await fetch(CONFIG.zebricekURL, { method: 'DELETE' });
    return r.ok;
  } catch (e) { return false; }
}

function slucZaznamy(a, b) {
  const mapa = new Map();
  [...(a || []), ...(b || [])].forEach(z => {
    if (z && z.jmeno != null && z.id) mapa.set(z.id, z);
  });
  return [...mapa.values()];
}

async function zapisVysledek(zaznam) {
  const lok = lokalniZebricek();
  lok.push(zaznam);
  ulozLokalne(lok);

  await zapisVzdalene(zaznam);
}

async function vykresliZebricek(mujZaznam) {
  const telo = $('zebricekBody');
  let data = lokalniZebricek();
  const vzd = await vzdalenyZebricek();
  if (vzd !== null) data = slucZaznamy(vzd, data);

  data.sort((x, y) => (y.body - x.body) || (new Date(x.kdy) - new Date(y.kdy)));

  if (!data.length) {
    telo.innerHTML = '<tr><td colspan="4" class="prazdno">Zatím tu nikdo není — buď první! 🎈</td></tr>';
    return 0;
  }

  const medaile = ['🥇', '🥈', '🥉'];
  telo.innerHTML = data.map((z, i) => {
    const jaId = stav && stav.zapsano ? null : null;
    const je_ja = stav && z.jmeno === stav.jmeno && z.body === stav.body && stav.hotovo;
    const datum = z.kdy ? new Date(z.kdy).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    return '<tr' + (je_ja ? ' class="ja"' : '') + '>' +
      '<td class="poradi">' + (medaile[i] ? '<span class="medaile">' + medaile[i] + '</span>' : (i + 1) + '.') + '</td>' +
      '<td>' + escapeHtml(z.jmeno) + '</td>' +
      '<td class="body">' + z.body + '/' + (z.celkem || OTAZKY.length) + '</td>' +
      '<td class="kdy">' + datum + '</td>' +
      '</tr>';
  }).join('');

  // Pořadí právě dohrané hry (kvůli hlášce na závěrečné stránce)
  let poradi = 0;
  if (mujZaznam) {
    const i = data.findIndex(z => z.id === mujZaznam.id);
    if (i >= 0) poradi = i + 1;
  }
  if (!poradi && stav && stav.hotovo && stav.zapsano) {
    const i = data.findIndex(z => z.jmeno === stav.jmeno && z.body === stav.body);
    if (i >= 0) poradi = i + 1;
  }
  return poradi;
}

/* ============================================================
   POČÍTADLO NÁVŠTĚV
   ============================================================ */
function pocitadlo() {
  if (!CONFIG.pocitadloURL) return;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 4000);
  fetch(CONFIG.pocitadloURL, { signal: ctrl.signal })
    .then(r => r.json())
    .then(d => { if (d && typeof d.value === 'number') $('pocitadlo').textContent = d.value; })
    .catch(() => { $('pocitadlo').textContent = '–'; })
    .finally(() => clearTimeout(t));
}

/* ============================================================
   HUDBA
   ============================================================ */
const audio = $('hudba');
let hudbaZapnuta = true;

/* Ikony reproduktoru (2D, kreslené) */
/* Vlaječka pro „Vzdávám to" — kreslená, aby držela barvu textu */
const IKONA_VLAJKA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 21V3.6"/><path d="M6.9 4.7c3.1-1.7 5.9 1.1 9-.5v7.9c-3.1 1.6-5.9-1.2-9 .5z" fill="currentColor" stroke="none"/></svg>';
function popisekVzdat(text) { return IKONA_VLAJKA + '<span>' + text + '</span>'; }

const IKONA_ZVUK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.3h3.3L12 5.2v13.6L7.3 14.7H4z" fill="currentColor" stroke="none"/><path d="M15.6 9.4a3.7 3.7 0 0 1 0 5.2"/><path d="M18.3 6.9a7.3 7.3 0 0 1 0 10.2"/></svg>';
const IKONA_TICHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.3h3.3L12 5.2v13.6L7.3 14.7H4z" fill="currentColor" stroke="none"/><path d="M16.2 9.8l4.6 4.6"/><path d="M20.8 9.8l-4.6 4.6"/></svg>';

function nastavIkonuHudby() {
  const b = $('hudbaBtn');
  b.innerHTML = hudbaZapnuta ? IKONA_ZVUK : IKONA_TICHO;
  b.title = hudbaZapnuta ? 'Vypnout hudbu' : 'Zapnout hudbu';
  b.setAttribute('aria-label', b.title);
}

/* --- Bezešvá smyčka přes Web Audio ---------------------------------------
   Prohlížeč umí <audio loop>, ale při přetočení na začátek nadělá kratičkou
   pauzu (MP3 má od kodéru na krajích ticho). Web Audio opakuje uvnitř jednoho
   bufferu, takže je napojení přesné na vzorek. Zvuk bereme z assets/hudba-data.js
   (tentýž MP3 v base64), aby to fungovalo i po otevření z disku, kde fetch()
   neprojde. Když cokoli z toho selže, spadne se zpět na <audio loop>. */
let ac = null, acGain = null, acZdroj = null, acBuffer = null, webAudioVypnuto = false;

function b64naBuffer(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

const AC = window.AudioContext || window.webkitAudioContext;
const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;

/* Dekódování běží hned po načtení stránky v offline kontextu — ten nepotřebuje
   uživatelské gesto (na iOS by se běžný AudioContext založený mimo gesto
   nerozjel). */
async function pripravWebAudio() {
  if (!AC || !OAC || !window.HUDBA_MP3_B64) return false;
  try {
    const data = b64naBuffer(window.HUDBA_MP3_B64);
    const off = new OAC(2, 1, 44100);
    acBuffer = await new Promise((ok, chyba) => {
      const r = off.decodeAudioData(data, ok, chyba);
      if (r && r.then) r.then(ok, chyba);
    });
    return true;
  } catch (e) { acBuffer = null; return false; }
}

/* iOS: dokud stránka nepřehraje něco přes <audio>, je Web Audio ztlumené
   přepínačem vyzvánění. Krátké ticho v médiovém přehrávači zvukovou relaci
   přepne, takže hudba je slyšet i v tichém režimu. */
let ticheAudio = null;
function odemkniZvuk() {
  if (!CONFIG.ticho) return;
  try {
    if (!ticheAudio) {
      ticheAudio = new Audio(CONFIG.ticho);
      ticheAudio.loop = true;
      ticheAudio.volume = 0.0001;
      ticheAudio.setAttribute('playsinline', '');
    }
    if (ticheAudio.paused) ticheAudio.play().catch(() => {});
  } catch (e) {}
}

/* Zvukový kontext zakládáme (a probouzíme) výhradně uvnitř kliknutí/doteku. */
function zapniKontext() {
  if (!AC || webAudioVypnuto) return false;
  odemkniZvuk();
  try {
    if (!ac) {
      ac = new AC();
      acGain = ac.createGain();
      acGain.gain.value = hudbaZapnuta ? CONFIG.hlasitost : 0;
      acGain.connect(ac.destination);
    }
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    return true;
  } catch (e) { ac = null; return false; }
}

/* iOS občas povolí zvuk až při dalším doteku — zkusíme to znovu. */
function zkusPriDalsimDoteku() {
  document.addEventListener('pointerdown', () => { spustHudbu(); }, { once: true, passive: true });
}

/* Dekodér MP3 přidá na začátek pár milisekund ticha — najdeme první zvuk
   a smyčku vedeme přesně od něj po CONFIG.delkaSmycky sekund. */
function zacatekZvuku(buf) {
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i += 32) {
    if (Math.abs(d[i]) > 0.002) return Math.max(0, (i - 32) / buf.sampleRate);
  }
  return 0;
}

function spustWebAudio() {
  if (webAudioVypnuto || !acBuffer || !zapniKontext()) return false;
  if (acGain) acGain.gain.value = CONFIG.hlasitost;
  if (acZdroj) return true;
  const z = ac.createBufferSource();
  const zac = zacatekZvuku(acBuffer);
  z.buffer = acBuffer;
  z.loop = true;
  z.loopStart = zac;
  z.loopEnd = Math.min(acBuffer.duration, zac + (CONFIG.delkaSmycky || acBuffer.duration));
  z.connect(acGain);
  z.start(0, zac);
  acZdroj = z;
  return true;
}

function pripravHudbu() {
  if (!CONFIG.hudba) return;
  nastavIkonuHudby();
  let zdroj = CONFIG.hudba;
  if (CONFIG.hudbaOgg && audio.canPlayType('audio/ogg; codecs=vorbis')) zdroj = CONFIG.hudbaOgg;
  audio.src = zdroj;
  audio.volume = CONFIG.hlasitost;
  audio.addEventListener('error', () => { if (!acBuffer) $('hudbaBtn').style.display = 'none'; }, { once: true });
  audio.addEventListener('canplay', () => { $('hudbaBtn').style.display = ''; }, { once: true });
  pripravWebAudio().then(ok => { if (ok) $('hudbaBtn').style.display = ''; });
  // Na mobilu se kontext probouzí dotekem — po prvním doteku to zkusíme znovu.
}

function spustHudbu() {
  if (!CONFIG.hudba || !hudbaZapnuta) return;
  odemkniZvuk();
  if (spustWebAudio()) {
    audio.pause();
    $('hudbaBtn').style.display = '';
    hlidejZvuk();
    return;
  }
  prehrajZalohu();
}

/* Záloha: obyčejný <audio loop>. Má na spoji smyčky kratičkou pauzu, ale hraje
   všude — včetně iPhonu, kde se Web Audio nemusí rozjet. */
function prehrajZalohu() {
  audio.play().then(() => { $('hudbaBtn').style.display = ''; }).catch(() => zkusPriDalsimDoteku());
}

/* Když se Web Audio do sekundy po gestu nerozběhne, přepneme na zálohu. */
let hlidacId = 0;
function hlidejZvuk() {
  clearTimeout(hlidacId);
  hlidacId = setTimeout(() => {
    if (!hudbaZapnuta) return;
    if (!ac || ac.state !== 'running') { zrusWebAudio(); prehrajZalohu(); }
  }, 1000);
}

function zrusWebAudio() {
  try { if (acZdroj) { acZdroj.stop(); acZdroj.disconnect(); } } catch (e) {}
  acZdroj = null;
  webAudioVypnuto = true;
}

function prepniHudbu() {
  hudbaZapnuta = !hudbaZapnuta;
  if (hudbaZapnuta) {
    spustHudbu();
  } else {
    clearTimeout(hlidacId);
    if (acGain) acGain.gain.value = 0;
    if (ac && ac.suspend) ac.suspend();
    audio.pause();
    if (ticheAudio) ticheAudio.pause();
  }
  nastavIkonuHudby();
}

/* ============================================================
   KONFETY
   ============================================================ */
function konfety(trvani) {
  const c = $('konfety');
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function velikost() {
    c.width = window.innerWidth * dpr;
    c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  velikost();
  c.classList.add('aktivni');

  const barvy = ['#ff6b9d', '#f8b500', '#4facfe', '#43e97b', '#a55eea', '#ffd43b'];
  const cast = [];
  for (let i = 0; i < 140; i++) {
    cast.push({
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * window.innerHeight,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 10,
      vy: 1.6 + Math.random() * 3.2,
      vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI,
      vrot: -0.12 + Math.random() * 0.24,
      barva: barvy[Math.floor(Math.random() * barvy.length)]
    });
  }

  const konec = Date.now() + trvani;
  function krok() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    cast.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      if (p.y > window.innerHeight + 30 && Date.now() < konec) {
        p.y = -20; p.x = Math.random() * window.innerWidth;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.barva;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (Date.now() < konec || cast.some(p => p.y < window.innerHeight + 30)) {
      requestAnimationFrame(krok);
    } else {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      c.classList.remove('aktivni');
    }
  }
  requestAnimationFrame(krok);
  window.addEventListener('resize', velikost);
}

/* ============================================================
   THEME TOGGLE (standard KeCl: jedno tlačítko Auto → Den → Noc)
   ============================================================ */
(function () {
  const html = document.documentElement;
  const btn = $('themeToggle');
  const iconEl = $('themeIcon');
  const labelEl = $('themeLabel');
  const hintEl = $('themeHint');
  const ORDER = ['auto', 'day', 'night'];
  let currentMode = 'auto';

  function isDayNow() { const h = new Date().getHours(); return h >= 6 && h < 19; }

  function render() {
    btn.dataset.mode = currentMode;
    if (currentMode === 'auto') {
      const day = isDayNow();
      html.setAttribute('data-theme', day ? 'light' : 'dark');
      iconEl.textContent = '◐';
      labelEl.textContent = 'Auto';
      hintEl.textContent = '';
      hintEl.style.display = 'none';
    } else if (currentMode === 'day') {
      html.setAttribute('data-theme', 'light');
      iconEl.textContent = '☀';
      labelEl.textContent = 'Den';
      hintEl.style.display = 'none';
    } else {
      html.setAttribute('data-theme', 'dark');
      iconEl.textContent = '☾';
      labelEl.textContent = 'Noc';
      hintEl.style.display = 'none';
    }
  }

  btn.addEventListener('click', () => {
    currentMode = ORDER[(ORDER.indexOf(currentMode) + 1) % ORDER.length];
    render();
  });

  render();
  setInterval(() => { if (currentMode === 'auto') render(); }, 60000);
})();

/* ============================================================
   START
   ============================================================ */
function spustHru(jmeno) {
  stav = novyStav(jmeno);
  ulozStav();
  $('pozdrav').textContent = 'Vítej, ' + stav.jmeno + '! 👋';
  vykresliMrizku();
  scena('sceneHra');
}

function obnovHru(s) {
  stav = s;
  $('pozdrav').textContent = 'Vítej zpátky, ' + stav.jmeno + '! 👋';
  vykresliMrizku();
  if (stav.hotovo) {
    $('konecJmeno').textContent = stav.jmeno + ', máš hotovo!';
    $('konecBody').textContent = stav.body;
    $('konecHodnoceni').textContent = hodnoceni(stav.body, OTAZKY.length);
    scena('sceneKonec');
    vykresliZebricek();
  } else {
    scena('sceneHra');
  }
}

/* Diagnostika zvuku — otevři appku s ?zvuk=1 na konci adresy. */
function zvukDiagnostika() {
  if (!/[?&]zvuk=1/.test(location.search)) return;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:999;background:rgba(0,0,0,.88);' +
    'color:#7CFC9B;font:11px/1.4 ui-monospace,monospace;padding:10px;border-radius:12px;white-space:pre-wrap;max-height:42vh;overflow:auto';
  document.body.appendChild(d);
  const vypis = () => {
    d.textContent =
      'UA: ' + navigator.userAgent + '\n' +
      'hudba-data.js: ' + (window.HUDBA_MP3_B64 ? Math.round(window.HUDBA_MP3_B64.length / 1024) + ' kB' : 'CHYBÍ') + '\n' +
      'buffer: ' + (acBuffer ? acBuffer.duration.toFixed(2) + ' s' : 'nedekódováno') + '\n' +
      'kontext: ' + (ac ? ac.state : 'nezaložen') + ' | zdroj: ' + (acZdroj ? 'běží' : 'ne') + ' | webAudio vypnuto: ' + webAudioVypnuto + '\n' +
      'audio: paused=' + audio.paused + ' t=' + audio.currentTime.toFixed(1) + ' ready=' + audio.readyState +
        ' err=' + (audio.error ? audio.error.code : '-') + ' src=' + (audio.currentSrc || '').split('/').pop() + '\n' +
      'ticho: ' + (ticheAudio ? 'paused=' + ticheAudio.paused : 'nezaloženo') + ' | hudba zapnutá: ' + hudbaZapnuta;
  };
  vypis();
  setInterval(vypis, 700);
}

document.addEventListener('DOMContentLoaded', () => {
  zvukDiagnostika();
  $('vzdatBtn').innerHTML = popisekVzdat('Vzdávám to');
  requestAnimationFrame(srovnejHlavicku);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(srovnejHlavicku);
  pripravHudbu();
  pocitadlo();

  // formulář se jménem
  $('jmenoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const jmeno = $('jmenoInput').value.trim().replace(/\s+/g, ' ');
    if (jmeno.length < 2) {
      $('jmenoChyba').textContent = 'Napiš prosím aspoň dvě písmenka. 🙂';
      $('jmenoInput').focus();
      return;
    }
    $('jmenoChyba').textContent = '';
    spustHudbu();
    spustHru(jmeno);
  });

  // karta
  $('kartaZavrit').addEventListener('click', () => {
    if (aktualniIdx !== null && Object.prototype.hasOwnProperty.call(stav.odpovedi, aktualniIdx)) pokracovat();
    else zavriKartu();
  });
  $('kartaPokracovat').addEventListener('click', pokracovat);
  $('karta').addEventListener('click', (e) => { if (e.target === $('karta')) $('kartaZavrit').click(); });

  // lightbox
  $('lightboxZavrit').addEventListener('click', zavriLightbox);
  $('lightbox').addEventListener('click', (e) => { if (e.target !== $('lightboxZavrit')) zavriLightbox(); });

  // klávesnice
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('lightbox').classList.contains('aktivni')) zavriLightbox();
    else if ($('karta').classList.contains('aktivni')) $('kartaZavrit').click();
  });

  // závěr
  $('zpetNaMrizku').addEventListener('click', () => scena('sceneHra'));
  $('zebricekBtn').addEventListener('click', () => scena('sceneKonec'));
  $('hratZnovu').addEventListener('click', () => {
    try { sessionStorage.removeItem(KLIC_STAV); } catch (e) {}
    location.reload();
  });

  // hudba
  $('hudbaBtn').addEventListener('click', prepniHudbu);

  // Vzdávám to — druhé kliknutí do 4 s potvrdí
  $('vzdatBtn').addEventListener('click', () => {
    if (!stav || stav.hotovo) return;
    const b = $('vzdatBtn');
    if (Date.now() - vzdatKlik > 4000) {
      vzdatKlik = Date.now();
      b.innerHTML = popisekVzdat('Opravdu skončit?');
      setTimeout(() => {
        if (Date.now() - vzdatKlik >= 4000) { b.innerHTML = popisekVzdat('Vzdávám to'); vzdatKlik = 0; }
      }, 4200);
      return;
    }
    vzdatKlik = 0;
    b.innerHTML = popisekVzdat('Vzdávám to');
    dokoncit(true);
  });

  // reset žebříčku
  $('resetToggle').addEventListener('click', () => {
    $('resetForm').classList.toggle('aktivni');
    $('resetZprava').textContent = '';
    if ($('resetForm').classList.contains('aktivni')) $('resetHeslo').focus();
  });
  $('resetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    resetZebricku($('resetHeslo').value);
  });

  // obnovení rozehrané hry po refreshi
  const ulozeny = nactiStav();
  if (ulozeny) obnovHru(ulozeny);
  else $('jmenoInput').focus();
});
</script>
